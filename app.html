<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOOGLE TRASH BETA</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="icon" href="favicon.ico">
</head>
<body>
    <header><img src="favicon_beta.png"></header>
    <h2 data-frloc="ENTRÉE">INPUT</h2>

    <p>Text to translate <a href="doc.html#texttotranslate">?</a></p>
    <textarea placeholder="Text to translate" type="text" multiple="true" id="inputbar" onchange="updateSettings()"></textarea>

    <p>Iterations <a href="doc.html#iterations">?</a></p>
    <input placeholder="Iterations" type="number" id="iterations" onchange="updateSettings()">

    <p class="hid">i</p>

    <p>Output Language <a href="doc.html#outputlanguage">?</a></p>
    <select id="outputLanguage" onchange="updateSettings()">
        <option data-frloc="Arabe" value="ar">Arabic</option>
        <option data-frloc="Chinois" value="zh">Chinese</option>
        <option data-frloc="Anglais" value="en" selected>English</option>
        <option data-frloc="Français" value="fr">French</option>
        <option data-frloc="Allemand" value="de">German</option>
        <option data-frloc="Hindi" value="hi">Hindi</option>
        <option data-frloc="Indonésien" value="id">Indonesian</option>
        <option data-frloc="Italien" value="it">Italian</option>
        <option data-frloc="Japonais" value="ja">Japanese</option>
        <option data-frloc="Coréen" value="ko">Korean</option>
        <option data-frloc="Polonais" value="pl">Polish</option>
        <option data-frloc="Portuguais" value="pt">Portuguese</option>
        <option data-frloc="Russe" value="ru">Russian</option>
        <option data-frloc="Espagnol" value="es">Spanish</option>
        <option data-frloc="Turc" value="tr">Turkish</option>
        <option data-frloc="Ukrainien" value="uk">Ukrainian</option>
        <option data-frloc="Vietnamien" value="vi">Vietnamese</option>
    </select>

    <h2 data-frloc="PARAMÈTRES AVANCÉS">ADVANCED SETTINGS</h2>
    <div id="showadvanced">
        <p data-frloc="Ceci ne devrait être utilisé que par les utilisateurs qui savent ce que ceci fait!">This should only be used by users that knows what those does!</p>
        <button data-frloc="Montrez-moi!" onclick="document.getElementById('showadvanced').style.display = 'none'; document.getElementById('advancedsettings').style.display = null">Show me!</button>
        <p class="hid">i</p>
    </div>

    <div id="advancedsettings" style="display: none">
        <p>Allow Accuracy <a href="doc.html#allowaccuracy">?</a></p>
        <input style="width: 4%; height: 4%;" onchange="updateSettings()" id="allowaccuracy" placeholder="Allow Accuracy" type="checkbox" value="false">

        <p id="minaccuracy_TXT" style="display: none">(loading)</p>
        <input onchange="updateSettings()" id="minaccuracy" style="display: none; height: 2%;" placeholder="Min Accuracy" type="range" min="0" max="100" value="50">
    </div>
    <p class="hid">i</p>

    <button data-frloc="GOOGLE TRASHEZ-LE!" id="googletrashit">GOOGLE TRASH IT!</button>
    
    <h2 data-frloc="SORTIE">OUTPUT</h2>
    <p data-frloc="STATUS: Je n'ai même pas débuté :/" id="status">STATUS: I was not even started :/</p>
    <progress style="display: none" value="0" max="1"></progress>
    <p class="hid">a</p>
    <textarea data-frloc="[AUCUNE TRADUCTION]" placeholder="Output" type="text" id="output" disabled="true">[NO TRANSLATION YET]</textarea>
    <p class="hid">i</p>
    <button id="importoutputasinput" disabled data-frloc="Insérer la Sortie en Entrée">Insert Output as Input</button>
    <button id="copy" disabled data-frloc="Copier la Sortie">Copy Output</button>

    <footer></footer>
    <script src="assets/footer.js"></script>
    <script src="assets/translationLogic.js"></script>
    <script src="assets/localization.js"></script>
</body>
