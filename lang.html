<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOOGLE TRASH LANGUAGE</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="icon" href="favicon.ico">
</head>
<body>
    <p style="color: #0000; font-size: 5px">-</p>
    <header><img src="favicon_beta.png"></header>
    <h1 data-frloc="BIENVENUE SUR GOOGLE TRASH">WELCOME TO GOOGLE TRASH</h1><br>
    <p data-frloc="Merci de nous dire dans quelle langue vous parlez">Please tell us which language you speak.</p>
    <p data-frloc="Ce paramètre ne changera pas la façon dont Google Trash fonctionne et peut être changé à n'importe quel moment en utilisant le pied de page.">This setting will not change the way Google Trash works and can be changed at any time by going to the page's footer.</p>

    <select id="selectedLang">
        <option value="en" id="selectedLang_en">English</option>
        <option value="fr" id="selectedLang_fr">Français</option>
    </select>
    <p class="inv"></p>
    <p data-frloc="Cette langue contient du texte non-traduit"></p>
    <button id="accessWebsite" data-frloc="Confirmer">Done</button>

    <br>
    <footer></footer>
    <script src="assets/localization.js"></script>
    <script src="assets/footer.js"></script>
</body>
