<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOOGLE TRASH SETTINGS</title>
    <link id="stylesheet" rel="stylesheet">
    <link rel="icon" href="favicon.ico">
</head>
<body>
    <p style="color: #0000; font-size: 5px">-</p>
    <header><img src="favicon_beta.png"></header>
    <h1 data-frloc="PARAMETRES">SETTINGS</h1><br>
    
    <h2 data-frloc="Changer de langue">Change language</h2>
    <h4>(Change language)</h4>
    <p data-frloc="Souhaitez-vous changer la langue de Google Trash? Bien, ce bouton pourrait vous aider.">Would you like to change your Google Trash language? Well, this button might help you.</p>
    <a data-frloc="Changer de langue" href="lang.html?red=settings.html">Change Language</a>

    <br>

    <h2 data-frloc="Thèmes">Themes</h2>
    <p data-frloc="Choisissez votre thème favoris pour faire de Google Trash votre maison!">Choose your favorite theme to make Google Trash your own home!</p>
    <select id="themes">
        <option data-frloc="Défaut" data-theme="default" value="default" selected disabled>Default</option>
        <option data-frloc="Clair" data-theme="light" value="light" disabled>Light</option>
        <option data-frloc="Sombre" data-theme="dark" value="dark" disabled>Dark</option>
        <option data-frloc="Halloween 2026" data-theme="halloween2026" value="halloween2026" disabled>Halloween 2026</option>
    </select>
    
    <br>
    <footer></footer>
    <script src="assets/localization.js"></script>
    <script src="assets/footer.js"></script>
    <script src="assets/scripts/style.js"></script>
</body>
</html>
